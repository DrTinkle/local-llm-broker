# Run `llm-broker setup` to fill this in.
[broker]
service_host = "127.0.0.1"
service_port = 1235
backend_url = "http://127.0.0.1:1234"
data_dir = "C:/Users/<user>/AppData/Local/LocalLLMBroker"
queue_limit = 100
max_body_bytes = 10485760
max_text_bytes = 1048576  # ~262K tokens; each job must still fit its tier's context
default_queue_timeout = 3600
load_timeout = 300
generation_timeout = 1800
stalled_stream_timeout = 600  # LM Studio streams nothing during prefill; long prompts on large models take minutes
max_stream_buffer_bytes = 1048576
max_result_bytes = 2097152
result_ttl_seconds = 600
metadata_ttl_days = 30
# Unload the loaded model after this many seconds with no running or queued jobs (0 = never).
idle_unload_seconds = 600
# Extra host names that may appear in the Host header, besides localhost. Needed when a Docker container calls the
# broker as host.docker.internal. The bearer token is still required. The broker still listens on 127.0.0.1 only.
# allowed_hosts = ["host.docker.internal"]

# Full path to LM Studio's `lms` tool. Only needed when it is not on PATH and not in ~/.lmstudio/bin.
# lms_path = "C:/Users/<user>/.lmstudio/bin/lms.exe"

# Profiles name the models a job can ask for. Keep model IDs aligned with the installed LM Studio catalog.
# parallel_ceiling is sent with every tier load as LM Studio's "Max Concurrent Predictions". Parallel jobs share
# the tier's context; the broker starts a job only when it fits beside the running ones.
# Settings: model_id (required), parallel_ceiling, variant, reasoning_effort (none | low | medium | high),
# supports_vision, thinks, description.
# [profiles.my-model]
# model_id = "publisher/model-name"
# parallel_ceiling = 1
# description = "One line on when to use this model."

# An embedding model (add it by hand; setup lists chat models only) stays loaded beside the chat model. It takes
# context_ceiling (the model's own window) and parallel_ceiling (most requests at once), and no tiers.
# [profiles.embed]
# kind = "embedding"
# model_id = "text-embedding-nomic-embed-text-v1.5@f16"
# context_ceiling = 2048
# parallel_ceiling = 4

# Load tiers, keyed by model ID. A job sets tier = "low" | "medium" | "high"; without one, the broker picks the
# smallest tier the job fits. Settings: context_length, kv_cache (f16 | q8_0 | q4_0), flash_attention,
# eval_batch_size, cpu_expert_ratio (MoE only), try_mmap.
# [tiers."publisher/model-name".low]
# context_length = 16384
# kv_cache = "f16"
